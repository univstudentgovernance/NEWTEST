<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>대학자치동향 | 대학자치연구원</title>
  <style>
    :root{--ink:#171717;--muted:#747474;--line:#e4e4e4;--accent:#7b001f;--paper:#fff;--wash:#f6f5f3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:var(--paper);letter-spacing:-.015em}.utility{height:34px;background:#3a3a3a;color:#ddd;font-size:12px}.utility>div,.masthead>div,.nav>div,main{width:min(1120px,calc(100% - 36px));margin:auto}.utility>div{height:100%;display:flex;align-items:center;justify-content:flex-end}.masthead{border-bottom:1px solid var(--line)}.masthead>div{height:92px;display:flex;align-items:center;justify-content:space-between}.brand{color:inherit;text-decoration:none}.brand strong{display:block;font-family:Georgia,"Noto Serif KR",serif;font-size:27px;letter-spacing:-.04em}.brand span{display:block;margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.nav{border-bottom:1px solid var(--line);background:#fff}.nav>div{display:flex;gap:34px;height:50px;align-items:center}.nav a{height:50px;display:flex;align-items:center;color:#333;text-decoration:none;font-weight:650;font-size:15px}.nav a.active{color:var(--accent);border-bottom:3px solid var(--accent)}main{padding:44px 0 70px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:2px solid #222;padding-bottom:18px}.page-head h1{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:30px}.meta{color:var(--muted);font-size:13px}.controls{display:grid;grid-template-columns:minmax(220px,1fr) 165px 165px 190px;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}input,select{width:100%;padding:11px 13px;border:1px solid #ccc;border-radius:2px;background:#fff;font:inherit}.list{padding-bottom:30px}.card{display:grid;grid-template-columns:166px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.thumb{width:166px;height:104px;object-fit:cover;background:linear-gradient(135deg,#eee,#ddd)}.logo-thumb{object-fit:contain;padding:14px;background:#fff;border:1px solid #eee}.thumb-fallback{display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#5d0018,#8d1534);font-family:Georgia,"Noto Serif KR",serif;font-weight:700}.news-body{min-width:0;display:flex;flex-direction:column}.title{font-size:19px;font-weight:760;line-height:1.42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{margin-top:7px;color:#646464;font-size:14px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source{margin-top:auto;padding-top:8px;color:#888;font-size:13px}.tag{color:var(--accent);font-weight:700;margin-right:8px}.source-kind{display:inline-block;margin-right:8px;padding:2px 6px;border:1px solid #d8d8d8;border-radius:2px;color:#555;font-size:11px;background:#fafafa}.card:hover .title{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.empty{padding:70px;text-align:center;color:var(--muted)}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:650px){.utility{display:none}.masthead>div{height:76px}.nav>div{gap:20px;overflow:auto}.page-head{display:block}.meta{margin-top:8px}.controls{grid-template-columns:1fr}.card{grid-template-columns:112px minmax(0,1fr);gap:14px;padding:16px 0}.thumb{width:112px;height:78px}.logo-thumb{padding:9px}.title{font-size:16px}.summary{display:none}.source{font-size:12px}.brand strong{font-size:23px}}
  </style>
</head>
<body>
  <div class="utility"><div>대학 학생자치 연구와 기록</div></div>
  <header class="masthead"><div><a class="brand" href="./"><strong>대학자치연구원</strong><span>University Autonomy Institute</span></a></div></header>
  <nav class="nav"><div><a href="#">연구원 소개</a><a href="#">학생회칙</a><a class="active" href="./">대학자치동향</a><a href="#">자료실</a></div></nav>
  <main>
    <div class="page-head"><h1>대학자치동향</h1><div class="meta" id="meta">자료를 불러오는 중…</div></div>
    <div class="controls"><input id="search" type="search" placeholder="기사·언론사 검색"><select id="publisher"><option value="">전체 출처</option><option value="university_press">대학 학보</option><option value="official_media">공식 언론사</option></select><select id="university"><option value="">전체 대학</option></select><select id="category"><option value="">전체 분야</option></select></div>
    <section class="list" id="list"></section>
  </main>
  <script>
    const state={items:[]}; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),cat=document.querySelector('#category').value,uni=document.querySelector('#university').value,kind=document.querySelector('#publisher').value;const rows=state.items.filter(x=>(!cat||x.category===cat)&&(!uni||(x.universities||[]).includes(uni))&&(!kind||x.publisher_group===kind)&&(!q||`${x.title} ${x.source} ${x.summary}`.toLowerCase().includes(q)));document.querySelector('#list').innerHTML=rows.length?rows.map(x=>{const kind=x.publisher_group==='university_press'?'대학 학보':'공식 언론사';return `<a class="card" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${x.image_url?`<img class="thumb ${x.thumbnail_type==='university_logo'?'logo-thumb':''}" src="${esc(x.image_url)}" alt="${x.thumbnail_type==='university_logo'?esc(x.source+' 로고'):''}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="thumb thumb-fallback">${esc(x.category||'대학자치')}</div>`}<div class="news-body"><div class="title">${esc(x.title)}</div><div class="summary">${esc(x.summary||'기사 원문에서 자세한 내용을 확인할 수 있습니다.')}</div><div class="source"><span class="tag">${esc(x.category)}</span><span class="source-kind">${kind}</span>${esc(x.source)} · ${new Date(x.published_at).toLocaleString('ko-KR')}</div></div></a>`}).join(''):'<div class="empty">조건에 맞는 기사가 없습니다.</div>'}
    fetch('./data/news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{state.items=d.items||[];document.querySelector('#meta').textContent=`${state.items.length.toLocaleString()}건 · 최종 수집 ${d.updated_at?new Date(d.updated_at).toLocaleString('ko-KR'):'아직 실행 전'}`;[...new Set(state.items.map(x=>x.category).filter(Boolean))].sort().forEach(c=>document.querySelector('#category').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`));(d.universities||[...new Set(state.items.flatMap(x=>x.universities||[]))]).forEach(u=>document.querySelector('#university').insertAdjacentHTML('beforeend',`<option>${esc(u)}</option>`));render()}).catch(()=>document.querySelector('#meta').textContent='자료를 불러오지 못했습니다.');
    document.querySelector('#search').addEventListener('input',render);document.querySelector('#category').addEventListener('change',render);document.querySelector('#publisher').addEventListener('change',render);document.querySelector('#university').addEventListener('change',e=>{if(e.target.value)document.querySelector('#publisher').value='';render()});
  </script>
</body>
</html>
